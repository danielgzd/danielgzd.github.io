name: Update daily radar

on:
  # Pull fresh RSS and news data every six hours (UTC).
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Identify dependency runtime
        id: dependency-runtime
        shell: bash
        run: |
          IDENTITY="$(node -p 'JSON.stringify([process.version, process.versions.modules, process.platform, process.arch])')|$(npm --version)|${ImageOS:-}|${ImageVersion:-}"
          echo "fingerprint=$(printf '%s' "$IDENTITY" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore installed Node dependencies
        id: installed-dependencies
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: installed-node-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-runtime.outputs.fingerprint }}-${{ hashFiles('package.json', 'package-lock.json', 'yarn.lock', '.npmrc', '.yarnrc.yml') }}-end
      - name: Install dependencies
        if: steps.installed-dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed Node dependencies
        if: steps.installed-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.installed-dependencies.outputs.cache-primary-key }}
      - name: Update daily radar data
        run: npm run headlines:update
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily radar"
          file_pattern: data/daily-headlines.json
